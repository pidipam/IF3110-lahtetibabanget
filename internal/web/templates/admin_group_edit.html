{{define "content"}}
{{$g := .Data.Group}}
<div class="card">
    <h1>Grup {{$g.Name}}</h1>
    {{if $g.Description}}<p class="muted">{{$g.Description}}</p>{{end}}
    <p>Data Grup, anggota, dan penghapusan Grup sekarang dikelola di aplikasi baru.</p>
    <div class="row">
        <a class="btn" href="/app/admin/grup/{{$g.ID}}">Kelola di aplikasi baru</a>
        <a class="btn secondary" href="/admin/groups/{{$g.ID}}/access">Atur akses database</a>
    </div>
</div>
{{end}}
