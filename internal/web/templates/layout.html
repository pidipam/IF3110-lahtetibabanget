{{define "layout"}}<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <title>{{.Title}} · lahtetibabanget Platform</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@700&display=swap" rel="stylesheet">
        <style>
            :root{--bg:#0c0c0e;--surface:rgba(255,255,255,.035);--surface-2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);--text:#f3f1f4;--muted:#a29da8;--pink:#d9a7cf;--pink-hover:#e6bbdc;--on-pink:#2a1430;--navy:#3b4462;--navy-hover:#4a5476;--danger:#f19a9a;--ok:#93dbb5}
            *{box-sizing:border-box}
            body{margin:0;min-height:100vh;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:16px;line-height:1.55;background:radial-gradient(ellipse 70% 45% at 50% -8%,rgba(255,255,255,.13),transparent 70%),radial-gradient(ellipse 40% 30% at 85% 10%,rgba(217,167,207,.07),transparent 70%),var(--bg);background-attachment:fixed}
            a{color:var(--pink)}
            header{padding:22px 40px}
            .bar{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
            .brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-family:"Urbanist",system-ui,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
            .brand svg{flex:none}
            .nav{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
            .nav a{padding:8px 18px;border-radius:999px;color:#dcd8df;text-decoration:none;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
            .nav a:hover{background:rgba(255,255,255,.06)}
            .nav a.active{background:var(--pink);color:var(--on-pink);font-weight:600}
            .nav a.active::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--on-pink)}
            .account{display:flex;justify-content:flex-end;align-items:center;gap:14px}
            .who{color:var(--muted);font-size:15px}
            .who strong{color:var(--text);font-weight:600}
            main{max-width:1080px;margin:28px auto 64px;padding:0 24px}
            .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:22px;backdrop-filter:blur(6px)}
            h1{font-size:30px;line-height:1.2;margin:0 0 18px;font-weight:700;letter-spacing:-.02em}
            h2{font-size:19px;margin:0 0 14px;font-weight:600}
            .hero{text-align:center;margin:56px auto 36px;max-width:640px}
            .hero h1{font-size:52px;line-height:1.08;margin-bottom:18px}
            .hero p{color:var(--muted);font-size:17px;margin:0}
            table{width:100%;border-collapse:collapse}
            th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
            th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
            tbody tr:hover{background:rgba(255,255,255,.025)}
            tbody tr:last-child td{border-bottom:none}
            label{display:block;font-weight:600;margin:16px 0 6px;font-size:14px;color:#dcd8df}
            input[type=text],input[type=password],select,textarea{width:100%;max-width:440px;padding:11px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
            input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(217,167,207,.18)}
            select option{background:#1b1a1e;color:var(--text)}
            input[type=checkbox]{accent-color:var(--pink);width:16px;height:16px}
            .check{display:flex;gap:10px;align-items:center;font-weight:500}
            button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;border-radius:999px;border:1px solid transparent;background:var(--pink);color:var(--on-pink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
            button:hover,.btn:hover{background:var(--pink-hover)}
            button.secondary,.btn.secondary{background:var(--navy);color:#fff}
            button.secondary:hover,.btn.secondary:hover{background:var(--navy-hover)}
            button.danger{background:transparent;color:var(--danger);border-color:rgba(241,154,154,.45)}
            button.danger:hover{background:rgba(241,154,154,.1)}
            button.ghost{background:transparent;color:var(--text);border-color:var(--line);padding:8px 18px;font-size:14px}
            button.ghost:hover{background:rgba(255,255,255,.06)}
            .inline{display:inline}
            .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
            .row h1{margin:0}
            .row + table{margin-top:18px}
            .spacer{flex:1}
            .muted{color:var(--muted)}
            .badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:#dcd8df}
            .badge.admin{background:rgba(217,167,207,.16);color:var(--pink)}
            .badge.off{background:rgba(241,154,154,.12);color:var(--danger)}
            .alert{padding:12px 18px;border-radius:14px;margin-bottom:20px;font-weight:500}
            .alert.error{background:rgba(241,154,154,.1);color:var(--danger);border:1px solid rgba(241,154,154,.3)}
            .alert.ok{background:rgba(147,219,181,.08);color:var(--ok);border:1px solid rgba(147,219,181,.28)}
            .narrow{max-width:440px;margin:0 auto 22px}
            .narrow input{max-width:none}
            .narrow button{width:100%;margin-top:8px}
            ul{padding-left:20px}
            li{margin:4px 0}
            .scroll{overflow-x:auto}
            .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
            .null{color:var(--muted);font-style:italic;font-size:13px}
            td.cell{max-width:320px;overflow-wrap:anywhere}
            .pager{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
        </style>
    </head>
    <body>
        <header>
            <div class="bar">
                <a class="brand" href="/">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <ellipse cx="14" cy="7" rx="10" ry="4" fill="#d9a7cf"/>
                        <path d="M4 7v7c0 2.2 4.5 4 10 4s10-1.8 10-4V7c0 2.2-4.5 4-10 4S4 9.2 4 7Z" fill="#f3f1f4" opacity=".85"/>
                        <path d="M4 14v7c0 2.2 4.5 4 10 4s10-1.8 10-4v-7c0 2.2-4.5 4-10 4s-10-1.8-10-4Z" fill="#f3f1f4" opacity=".55"/>
                    </svg>
                    lahtetibabanget
                </a>
                {{if .User}}
                    <nav class="nav">
                        <a href="/"{{if eq .Nav "home"}} class="active"{{end}}>Beranda</a>
                        <a href="/databases"{{if eq .Nav "databases"}} class="active"{{end}}>Database</a>
                        {{if .User.IsAdmin}}
                            <a href="/admin/users"{{if eq .Nav "users"}} class="active"{{end}}>User</a>
                            <a href="/admin/groups"{{if eq .Nav "groups"}} class="active"{{end}}>Grup</a>
                            <a href="/admin/connections"{{if eq .Nav "connections"}} class="active"{{end}}>Koneksi</a>
                        {{end}}
                    </nav>
                    <div class="account">
                        <span class="who">Masuk sebagai <strong>{{.User.Username}}</strong></span>
                        <form class="inline" method="post" action="/logout">
                            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
                            <button type="submit" class="secondary">Logout</button>
                        </form>
                    </div>
                {{end}}
            </div>
        </header>
        <main>
            {{if .Notice}}<div class="alert ok">{{.Notice}}</div>{{end}}
            {{if .Error}}<div class="alert error">{{.Error}}</div>{{end}}
            {{template "content" .}}
        </main>
    </body>
</html>
{{end}}
