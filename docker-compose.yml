services:
  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp
    ports:
      - "5434:5433"
    volumes:
      - platform-data:/var/lib/postgresql/data
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp_test
    ports:
      - "5433:5434"
  target-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sample
    ports:
      - "5435:5432"
    volumes:
      - ./internal/db/target-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d sample"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  platform-data: