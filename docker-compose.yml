services:
  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp
    ports:
      - "5434:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp_test
    ports:
      - "5433:5432"
volumes:
  platform-data: