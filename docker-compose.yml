services:
  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp
    ports:
      - "5434:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dbmp"]
      interval: 2s
      timeout: 3s
      retries: 30
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dbmp_test
    ports:
      - "5433:5432"
  target-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sample
    ports:
      - "5435:5432"
    volumes:
      - ./internal/db/target-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d sample"]
      interval: 2s
      timeout: 3s
      retries: 30
    
  target-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: sample
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - ./internal/db/target-seed-mysql.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build: .
    command: ["worker"]
    network_mode: host
    environment:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5434/dbmp?sslmode=disable
      APP_ENCRYPTION_KEY: ViQIBs1QPisgpu5jmZ6xOAvG25UXZhzma/gdUag/afA=
      WORKER_ID: compose-worker-1
      WORKER_LEASE: 30s
      WORKER_POLL_INTERVAL: 250ms
      WORKER_MAX_ATTEMPTS: 5
      WORKER_RECOVERY_INTERVAL: 15s
      LOG_LEVEL: info
      OTEL_SERVICE_NAME: dbmp
    depends_on:
      platform-db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  platform-data: